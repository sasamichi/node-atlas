<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拠点 | Node Atlas（ノード・アトラス）</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.7;color:#222;background:#fff}a{color:#0b5cad}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:.35rem;text-align:left}th{background:#f5f5f5}input{width:100%;padding:.6rem;font-size:1rem;background:#f5f5f5;color:#222;border:1px solid #bbb;border-radius:4px}nav{margin-bottom:1rem}nav a{margin-right:1rem}.meta{color:#666;font-size:.9em}.warn{background:#fff3cd;border:1px solid #e0c060;padding:.6rem 1rem}.items{list-style:none;padding:0;margin:.5rem 0}.items li{padding:.35rem 0;border-bottom:1px solid #e5e5e5}.yomi{display:block;color:#666;font-size:.85em}</style></head>
<body><nav><a href="./index.html">トップ</a><a href="./countries.html">国・地域</a><a href="./transport.html">交通データ</a><a href="./about.html">このサイトについて</a></nav>
<div id="app"><p>読み込んでいます…</p></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);
const eid=params.get('id')||'';
const ecc=eid.split('-')[1]||'';
function fail(msg){document.getElementById('app').innerHTML='<p>'+esc(msg)+'</p>'}
function cell(v){return (v&&typeof v==='object')?'<a href="'+esc(v.u)+'">'+esc(v.t)+'</a>':esc(v)}
function metaTable(rows){return '<table>'+rows.map(r=>'<tr><th>'+esc(r[0])+'</th><td>'+cell(r[1])+'</td></tr>').join('')+'</table>'}
function metaLine(segs){return '<p class="meta">'+segs.map(s=>s.u?'<a href="'+esc(s.u)+'">'+esc(s.t)+'</a>':esc(s.t)).join(' ／ ')+'</p>'}

if(!eid||!ecc){fail('IDが指定されていません。')}
else fetch('data/nodes-'+ecc+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(DB=>{
const v=DB[eid];
if(!v){fail('見つかりませんでした。');return}
document.title=v.name+' | Node Atlas（ノード・アトラス）';
let h='';

h+='<h1>'+esc(v.name)+'</h1>';
h+=metaTable(v.meta);
if(v.notes)h+='<p>'+esc(v.notes)+'</p>';
if(v.lines&&v.lines.length)h+='<h2>所属する路線</h2><ul class="items">'+v.lines.map(l=>'<li><a href="line.html?id='+l.id+'">'+esc(l.name)+'</a></li>').join('')+'</ul>';
if(v.transfers&&v.transfers.length)h+='<h2>乗換</h2><ul class="items">'+v.transfers.map(l=>'<li><a href="line.html?id='+l.id+'">'+esc(l.name)+'</a></li>').join('')+'</ul>';
if(v.conns&&v.conns.length)h+='<h2>接続する拠点</h2><ul class="items">'+v.conns.map(l=>'<li><a href="node.html?id='+l.id+'">'+esc(l.name)+'</a></li>').join('')+'</ul>';
if(v.systems&&v.systems.length)h+='<h2>所属する交通網</h2><p>'+v.systems.map(s=>esc(s)).join('、')+'（<a href="transport.html">交通データ</a>）</p>';

document.getElementById('app').innerHTML=h;
}).catch(()=>fail('データを読み込めませんでした。'));
</script>
</body></html>
