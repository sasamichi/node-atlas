<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拠点一覧 | Node Atlas（ノード・アトラス）</title><link rel="stylesheet" href="assets/site.css"></head>
<body><div class="pagecard"><nav><a href="./index.html">トップ</a><a href="./countries.html">国・地域</a><a href="./transport.html">交通データ</a><a href="./search.html">検索</a><a href="./map.html">地図</a><a href="./about.html">このサイトについて</a></nav>
<div id="app"><p>読み込んでいます…</p></div>
<script src="assets/common.js?v=e8a05019"></script>
<script>
fetch('data/nodes-JP.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(DB=>{
var _RG=DB['__rgn']||{},_LM=DB['__lines']||{};
var ids=Object.keys(DB).filter(k=>k.charAt(0)!=='_').sort();
function mrow(v,lab){for(var i=0;i<v.meta.length;i++)if(v.meta[i][0]===lab)return v.meta[i][1];return ''}
let h='<h1>拠点一覧</h1>\n<p>収集済みの拠点 '+ids.length+' 件です。駅・停留場・港・空港・インターチェンジなどを含みます。名称を押すと拠点の詳細が開きます。</p>\n';
h+='<table class="lst"><tr><th>名称</th><th>読み</th><th>種別</th><th>コード</th><th>自治体</th><th>座標</th><th>所属路線</th></tr>'+
ids.map(function(nid){var v=DB[nid];var mu=mrow(v,'自治体');var mn=(mu&&typeof mu==='object'&&mu.i)?_RG[mu.i][0]:'';
var co=mrow(v,'座標');var ct=(co&&typeof co==='object')?co.t:'―';
var lns=(v.lines||[]).map(function(lid){return '<a href="line.html?id='+lid+'">'+esc(_LM[lid][0])+'</a>'}).join('、');
return '<tr><td><a href="node.html?id='+nid+'">'+esc(v.name)+'</a></td><td>'+esc(pairReading(v.meta))+'</td><td>'+esc(mrow(v,'種別'))+'</td><td>'+esc(mrow(v,'コード'))+'</td><td>'+esc(mn)+'</td><td>'+esc(ct)+'</td><td>'+lns+'</td></tr>'}).join('')+'</table>\n';
document.getElementById('app').innerHTML=h;enhance();
}).catch(()=>{document.getElementById('app').innerHTML='<p>データを読み込めませんでした。</p>'});
</script>
</div></body></html>
