<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地図から探す | Node Atlas（ノード・アトラス）</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.7;color:#222;background:#fff}a{color:#0b5cad}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:.35rem;text-align:left}th{background:#f5f5f5}input{width:100%;padding:.6rem;font-size:1rem;background:#f5f5f5;color:#222;border:1px solid #bbb;border-radius:4px}input[type=search]{width:60%}select{padding:.45rem}nav{margin-bottom:1rem}nav a{margin-right:1rem}.meta{color:#666;font-size:.9em}.warn{background:#fff3cd;border:1px solid #e0c060;padding:.6rem 1rem}.items{list-style:none;padding:0;margin:.5rem 0}.items li{padding:.35rem 0;border-bottom:1px solid #e5e5e5}.yomi{display:block;color:#666;font-size:.85em}details{margin:.4rem 0}details ul{padding-left:1.2rem}summary{cursor:pointer}h4{margin:.8rem 0 .2rem;font-size:1rem}</style></head>
<body><nav><a href="./index.html">トップ</a><a href="./countries.html">国・地域</a><a href="./transport.html">交通データ</a><a href="./map.html">地図</a><a href="./about.html">このサイトについて</a></nav>
<style>body{max-width:1200px}#map{height:72vh;min-height:420px;border:1px solid #ccc}.sqicon{background:transparent;border:none}.seat-sq{border:1px solid #fff;box-sizing:border-box}.mapctl{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin:.6rem 0}.mapctl label{font-size:.95rem}.mapctl input{width:auto}.kindbadge{display:inline-block;background:#e8eef5;border:1px solid #b6c6da;border-radius:9px;padding:0 .55em;font-size:.82em;color:#1a365d;margin-top:.15em}</style>
<h1>地図から探す</h1>
<p class="meta">座標のある拠点と、自治体・地域（政庁所在地）を表示しています。マーカーを押すと詳細ページへのリンクが出ます。路線の線は表示しません（点データのみの方針）。</p>
<div class="mapctl">
<label>背景地図 <select id="baseSel"><option value="pale">地理院タイル（淡色）</option><option value="std">地理院タイル（標準）</option><option value="osm">OpenStreetMap</option></select></label>
<label><input type="checkbox" id="ck-rail" checked> 鉄道 <span id="cnt-rail"></span></label>
<label><input type="checkbox" id="ck-road" checked> 道路 <span id="cnt-road"></span></label>
<label><input type="checkbox" id="ck-bus" checked> バス <span id="cnt-bus"></span></label>
<label><input type="checkbox" id="ck-air" checked> 航空 <span id="cnt-air"></span></label>
<label><input type="checkbox" id="ck-sea" checked> 港湾 <span id="cnt-sea"></span></label>
<label><input type="checkbox" id="ck-seat" checked> 自治体・地域 <span id="cnt-seat"></span></label>
<label><input type="checkbox" id="ck-wst" checked> 気象観測地点 <span id="cnt-wst"></span></label>
</div>
<p class="meta" style="margin:.3rem 0">形：自治体・地域は四角（大きい濃色が都道府県、小さい淡色が市区町村・行政区）、交通網は円（空港・港湾は大きめの円）、気象観測地点は三角です。</p>
<div id="map"></div>
<p class="meta">背景地図：地理院タイル（国土地理院）／ © OpenStreetMap contributors。地図ライブラリ：Leaflet。</p>
<link rel="stylesheet" href="assets/leaflet.css">
<script src="assets/leaflet.js"></script>
<script>
(function(){
var BASES = {
  pale: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {attribution: '地理院タイル', maxZoom: 18}],
  std: ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {attribution: '地理院タイル', maxZoom: 18}],
  osm: ['https://tile.openstreetmap.de/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap contributors', maxZoom: 18}]
};
var KIND_COLOR = {'旅客駅':'#2b6cb0','貨物駅':'#2b6cb0','信号場':'#2b6cb0','停留場':'#2b6cb0','索道駅':'#2b6cb0','港':'#6b46c1','フェリーターミナル':'#6b46c1','空港':'#c53030','インターチェンジ':'#dd6b20','ジャンクション':'#dd6b20','サービスエリア':'#dd6b20','パーキングエリア':'#dd6b20','高速バス停留所':'#dd6b20'};
function esc(s){return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var map = L.map('map');
var base = L.tileLayer(BASES.pale[0], BASES.pale[1]).addTo(map);
var GROUPS = ['rail', 'road', 'bus', 'air', 'sea', 'seat', 'wst'];
var layers = {}, counts = {};
GROUPS.forEach(function(g){ layers[g] = L.layerGroup().addTo(map); counts[g] = 0; });
fetch('data/map-points.json').then(function(r){return r.json()}).then(function(pts){
  var bounds = [];
  pts.forEach(function(p){
    var isSeat = p.t === 's';
    var m;
    if (isSeat) {
      var sz = p.sub === 'upper' ? 13 : 9;
      m = L.marker([p.lat, p.lng], {icon: L.divIcon({className: 'sqicon', iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2], html: '<div class="seat-sq" style="width:' + sz + 'px;height:' + sz + 'px;background:' + (p.sub === 'upper' ? '#975a16' : '#d9a441') + '"></div>'})});
    } else if (p.t === 'w') {
      m = L.marker([p.lat, p.lng], {icon: L.divIcon({className: 'sqicon', iconSize: [14, 14], iconAnchor: [7, 7], html: '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1 L13 13 L1 13 Z" fill="#319795" stroke="#ffffff" stroke-width="1"/></svg>'})});
    } else {
      var big = (p.g === 'air' || p.g === 'sea');
      m = L.circleMarker([p.lat, p.lng], {radius: big ? 8 : 5, weight: 1, color: '#ffffff', fillColor: KIND_COLOR[p.kind] || '#4a5568', fillOpacity: 0.9});
    }
    var title = p.t === 'w' ? esc(p.name) : '<a href="' + (isSeat ? 'region.html?id=' : 'node.html?id=') + p.id + '">' + esc(p.name) + '</a>';
    m.bindPopup('<b>' + title + '</b>' + (p.reading ? '<br>' + esc(p.reading) : '') + '<br><span class="kindbadge">' + esc(p.kind) + '</span>');
    if (layers[p.g]) { m.addTo(layers[p.g]); counts[p.g]++; } else { m.addTo(map); }
    bounds.push([p.lat, p.lng]);
  });
  GROUPS.forEach(function(g){
    document.getElementById('cnt-' + g).textContent = '（' + counts[g] + '件）';
    if (!counts[g]) document.getElementById('ck-' + g).disabled = true;
  });
  if (bounds.length) map.fitBounds(bounds, {padding: [20, 20]});
}).catch(function(){ document.getElementById('map').innerHTML = '<p style="padding:1rem">データを読み込めませんでした。</p>'; });
document.getElementById('baseSel').addEventListener('change', function(e){
  var b = BASES[e.target.value]; map.removeLayer(base); base = L.tileLayer(b[0], b[1]).addTo(map);
});
GROUPS.forEach(function(g){
  document.getElementById('ck-' + g).addEventListener('change', function(e){ if (e.target.checked) map.addLayer(layers[g]); else map.removeLayer(layers[g]); });
});
})();
</script>
</body></html>
