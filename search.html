<title>検索 | Node Atlas（ノード・アトラス）</title><style>body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;max-width:980px;margin:0 auto;padding:1.4rem .6rem 2.5rem;line-height:1.7;color:#35301f;background:#f1ead8}.pagecard{background:#fdfaf0;border:1px solid #d6c9a3;box-shadow:0 1px 6px rgba(90,74,32,.15);padding:.8rem 1.4rem 2.2rem}a{color:#2e5d46}table{border-collapse:collapse;width:100%}td,th{border:none;border-bottom:1px solid #d6c9a3;padding:.35rem;text-align:left}th{background:#e7dcba;color:#3c3520;border-bottom:2px solid #b7a76f}tr:nth-child(even) td{background:#faf4e0}input{width:100%;padding:.6rem;font-size:1rem;background:#fdfaf0;color:#35301f;border:1px solid #b7a76f;border-radius:4px}input[type=search]{width:60%}select{padding:.45rem;background:#fdfaf0;color:#35301f;border:1px solid #b7a76f}nav{margin-bottom:1rem;border-bottom:4px double #8a6d3b;padding-bottom:.5rem}nav a{margin-right:1rem;color:#3c4f2e;font-weight:bold;text-decoration:none}nav a:hover{text-decoration:underline}.meta{color:#7a6c42;font-size:.9em}.warn{background:#f7ead0;border:1px solid #c9a44a;padding:.6rem 1rem}.items{list-style:none;padding:0;margin:.5rem 0}.items li{padding:.35rem 0;border-bottom:1px solid #ddd0a4}.yomi{display:block;color:#7a6c42;font-size:.85em}details{margin:.4rem 0}details ul{padding-left:1.2rem}summary{cursor:pointer}h4{margin:.8rem 0 .2rem;font-size:1rem}h1,h2{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:#3c4f2e}h2{border-bottom:1px solid #b7a76f;padding-bottom:.15em}.disclaimer{font-size:.85rem;line-height:1.65}</style></head>
<body><div class="pagecard"><nav><a href="./index.html">トップ</a><a href="./countries.html">国・地域</a><a href="./transport.html">交通データ</a><a href="./search.html">検索</a><a href="./map.html">地図</a><a href="./about.html">このサイトについて</a></nav>
<h1>キーワードから検索</h1>
<input id="q" placeholder="国名・地域名・駅名・コードで検索（例：北海道、白石、JP-01、H03）" oninput="f()">
<div id="r"></div>
<script src="search-data.js"></script>
<script>
function f(){const q=document.getElementById('q').value.trim();const el=document.getElementById('r');
if(!q){el.innerHTML='<p>上の欄に入力してください。</p>';return}
const m=SEARCH.map(x=>Array.isArray(x)?{n:x[0],e:x[1],t:'地域',d:x[2],i:x[3]}:x).filter(x=>(x.n+x.e+x.d).toLowerCase().includes(q.toLowerCase())).slice(0,50);
el.innerHTML=m.length?'<table><tr><th>名称</th><th>種別</th><th>補足</th></tr>'+m.map(x=>`<tr><td><a href="${x.u||('region.html?id='+x.i)}">${x.n}</a></td><td>${x.t}</td><td>${x.d}</td></tr>`).join('')+'</table>':'<p>見つかりませんでした。</p>'}f();
</script>
</div></body></html>
