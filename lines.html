<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>路線一覧 | Node Atlas（ノード・アトラス）</title><link rel="stylesheet" href="assets/site.css"></head>
<body><div class="pagecard"><nav><a href="./index.html">トップ</a><a href="./countries.html">国・地域</a><a href="./transport.html">交通データ</a><a href="./search.html">検索</a><a href="./map.html">地図</a><a href="./about.html">このサイトについて</a></nav>
<div id="app"><p>読み込んでいます…</p></div>
<script src="assets/common.js?v=e8a05019"></script>
<script>
fetch('data/lines-JP.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(DB=>{
function irow(v,lab){for(var i=0;i<v.info.length;i++)if(v.info[i][0]===lab)return v.info[i][1];return ''}
let h='<h1>路線一覧</h1>\n<p>収集済みの路線を交通網ごとに並べています。路線名を押すと、収集済みの拠点と区間が開きます。</p>\n';
(DB['__syslist']||[]).forEach(function(sl){
var lids=Object.keys(DB).filter(k=>k.charAt(0)!=='_'&&DB[k].sys===sl[0]).sort();
h+='<h2 id="'+sl[0]+'">'+esc(sl[1])+'</h2>\n<table class="lst"><tr><th>路線名</th><th>読み</th><th>種別</th><th>事業者</th><th>総延長 km</th><th>状態</th></tr>'+
lids.map(function(lid){var v=DB[lid];var op=irow(v,'事業者');if(op&&typeof op==='object')op=op.t;
return '<tr><td><a href="line.html?id='+lid+'">'+esc(v.name)+'</a></td><td>'+esc(pairReading(v.info))+'</td><td>'+esc(irow(v,'種別'))+'</td><td>'+esc(op)+'</td><td>'+esc(irow(v,'総延長（km）'))+'</td><td>'+esc(irow(v,'状態'))+'</td></tr>'}).join('')+'</table>\n'});
document.getElementById('app').innerHTML=h;enhance();
}).catch(()=>{document.getElementById('app').innerHTML='<p>データを読み込めませんでした。</p>'});
</script>
</div></body></html>
