<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地域 | Node Atlas（ノード・アトラス）</title><link rel="stylesheet" href="assets/site.css"></head>
<body><div class="pagecard"><nav><a href="./index.html">トップ</a><a href="./countries.html">国・地域</a><a href="./transport.html">交通データ</a><a href="./search.html">検索</a><a href="./map.html">地図</a><a href="./about.html">このサイトについて</a></nav>
<div id="app"><p>読み込んでいます…</p></div>
<script src="assets/common.js?v=daba14fb"></script>
<script>
if(!eid||!ecc){fail('IDが指定されていません。')}
else fetch('data/regions-'+ecc+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(DB=>{
const v=DB[eid];
if(!v){fail('見つかりませんでした。');return}
document.title=v.name+' | Node Atlas（ノード・アトラス）';
let h='';

const _cc=DB['__country'],_dd=DB['__data'];
if(_cc&&!v.crumb)v.crumb=[_cc];
if(_cc&&!(v.meta||[]).some(p=>p[0]==='国'))v.meta=[['国',{t:_cc.name,u:'countries/'+_cc.cc+'.html',r:_cc.reading}]].concat(v.meta||[]);
if(!v.data&&_dd)v.data=_dd;
if(!v.nodes_title)v.nodes_title=(v.kind==='市区町村'||v.kind==='行政区')?'この自治体の拠点':'この地域の拠点';
if(!v.links)v.links=[];
h+='<p class="meta">'+v.crumb.map(c=>c.cc?'<a href="countries/'+c.cc+'.html">'+rubyName(c.name,c.reading)+'</a>':'<a href="region.html?id='+c.id+'">'+rubyName(DB[c.id].name,DB[c.id].reading)+'</a>').join(' &gt; ')+(v.crumb.length?' &gt; ':'')+esc(v.name)+'</p>';
h+='<h1>'+rubyName(v.name,v.reading)+'</h1>';
const meta=[['名称',v.name]];
if(v.reading)meta.push(['読み',v.reading]);
meta.push(['種別',v.kind]);
v.meta.forEach(r=>{var c=r[1];if(c&&typeof c==='object'&&c.i)c={t:DB[c.i].name,u:c.i,r:DB[c.i].reading};meta.push([r[0],c])});
meta.push(['状態',v.status||'現存']);
h+='<h2>'+lb('基本情報')+'</h2>'+metaTable(meta);
const notesTxt=v.notes||(v.nc?'出典リストは一部の国で最近の再編が未反映の可能性あり':'');
if(notesTxt)h+='<p class="meta">'+esc(notesTxt)+'</p>';
(v.sections||[]).forEach(sec=>{
  if(sec.type==='table'){
    h+='<h2>'+lb(sec.title)+'（'+sec.rows.length+'）</h2>'+lstTable(sec.cols,sec.rows,'region.html?id=',DB);
  }else{
    h+='<h2>'+lb(sec.title)+'（'+sec.items.length+'）</h2>';
    sec.items.forEach(it=>{
      const iv=DB[it.id];
      h+='<details><summary><a href="region.html?id='+it.id+'">'+esc(iv.name)+'</a>（'+it.rows.length+'）'+(iv.reading?' <span class="meta">'+esc(iv.reading)+'</span>':'')+'</summary>'+lstTable(it.cols,it.rows,'region.html?id=',DB)+'</details>';
    });
  }
});
if(v.node_groups&&v.node_groups.length){
  h+='<h2>'+lb(v.nodes_title)+'（'+v.nodes_count+'）</h2>';
  v.node_groups.forEach(g=>{
    h+='<h3>'+lb(g.kind)+'（'+g.count+'）</h3>';
    g.lines.forEach(lg=>{
      h+='<h4><a href="line.html?id='+lg.id+'">'+esc(lg.name)+'</a>（'+lg.nodes.length+'）</h4><ul class="items">'+lg.nodes.map(n=>'<li><a href="node.html?id='+n.id+'">'+rubyName(n.name,(DB['__nr']||{})[n.id])+'</a></li>').join('')+'</ul>';
    });
    if(g.plain.length)h+='<ul class="items">'+g.plain.map(n=>'<li><a href="node.html?id='+n.id+'">'+rubyName(n.name,(DB['__nr']||{})[n.id])+'</a></li>').join('')+'</ul>';
  });
}
if(v.links&&v.links.length)h+='<h2>リンク</h2><ul class="items">'+v.links.map(x=>'<li><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.label)+'</a></li>').join('')+'</ul>';
h+=dataLine(v.data);

document.getElementById('app').innerHTML=h;
enhance();
}).catch(()=>fail('データを読み込めませんでした。'));
</script>
</div></body></html>
