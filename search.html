<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>検索 | Node Atlas（ノード・アトラス）</title><link rel="stylesheet" href="assets/site.css"></head>
<body><div class="pagecard"><nav><a href="./index.html">トップ</a><a href="./countries.html">国・地域</a><a href="./transport.html">交通データ</a><a href="./search.html">検索</a><a href="./map.html">地図</a><a href="./about.html">このサイトについて</a></nav>
<h1>キーワードから検索</h1>
<input id="q" placeholder="国名・地域名・駅名・コードで検索（例：北海道、白石、JP-01、H03）" oninput="f()">
<div id="r"></div>
<script src="search-data.js"></script>
<script>
function f(){const q=document.getElementById('q').value.trim();const el=document.getElementById('r');
if(!q){el.innerHTML='<p>上の欄に入力してください。</p>';return}
const m=SEARCH.map(x=>Array.isArray(x)?{n:x[0],e:x[1],t:'地域',d:x[2],i:x[3]}:x).filter(x=>(x.n+x.e+x.d).toLowerCase().includes(q.toLowerCase())).slice(0,50);
el.innerHTML=m.length?'<table><tr><th>名称</th><th>種別</th><th>補足</th></tr>'+m.map(x=>`<tr><td><a href="${x.u||('region.html?id='+x.i)}">${x.n}</a></td><td>${x.t}</td><td>${x.d}</td></tr>`).join('')+'</table>':'<p>見つかりませんでした。</p>'}f();
</script>
</div></body></html>
